name: GCP Build and Push to Artifact Registry

# workflow_version: 0.0.0 Dated 10 June 2026
# Authenticates to GCP via service account key, builds a Docker image, and pushes to Artifact Registry.

on:
  workflow_call:
    inputs:
      repository:
        description: "The calling repository (e.g. 'my-org/my-repo'). Used for code checkout."
        required: true
        type: string
      service:
        description: "The service name (e.g. 'ai-chatbot'). Used to locate the Dockerfile and build context."
        required: true
        type: string
      version:
        description: "The image tag to apply (e.g. 'v1.2.3')."
        required: true
        type: string
      artifact-registry-region:
        description: "GCP region of the Artifact Registry (e.g. 'us-central1')."
        required: false
        type: string
        default: "us-central1"
      artifact-registry-host:
        description: "Artifact Registry hostname (e.g. 'us-central1-docker.pkg.dev')."
        required: false
        type: string
        default: "us-central1-docker.pkg.dev"
      image-path:
        description: "Full Artifact Registry image path excluding tag (e.g. 'us-central1-docker.pkg.dev/my-project/my-repo/my-service')."
        required: true
        type: string
      build_timeout_minutes:
        description: "Maximum minutes the build job may run before cancellation."
        required: false
        type: string
        default: "20"
    secrets:
      GCP_SA_KEY:
        required: true

jobs:
  build-and-push:
    name: Build and Push to Artifact Registry
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.build_timeout_minutes != '' && inputs.build_timeout_minutes || '20') }}

    steps:
      - name: Checkout calling repo
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository }}

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ inputs.artifact-registry-host }} --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Print image tags
        run: |
          echo "Image will be tagged as:"
          echo "${{ inputs.image-path }}:${{ inputs.version }}"
          echo "${{ inputs.image-path }}:latest"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ inputs.service }}
          file: ./${{ inputs.service }}/Dockerfile
          push: true
          tags: |
            ${{ inputs.image-path }}:${{ inputs.version }}
            ${{ inputs.image-path }}:latest

  report-outcome:
    name: Report Build Outcome on Failure
    runs-on: ubuntu-latest
    needs: build-and-push
    if: always() && (needs.build-and-push.result == 'failure' || needs.build-and-push.result == 'cancelled' || needs.build-and-push.result == 'timed_out')
    steps:
      - name: Write failure summary
        run: |
          echo "::warning::Build job ended with result: ${{ needs.build-and-push.result }}"
          {
            echo "> [!CAUTION]"
            echo "> The build job ended with result: \`${{ needs.build-and-push.result }}\`"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Result | \`${{ needs.build-and-push.result }}\` |"
            echo "| Service | \`${{ inputs.service }}\` |"
            echo "| Image Version | \`${{ inputs.version }}\` |"
            echo "| Image Path | \`${{ inputs.image-path }}\` |"
            echo "| Build Timeout limit | \`${{ inputs.build_timeout_minutes }} min\` |"
          } >> $GITHUB_STEP_SUMMARY


