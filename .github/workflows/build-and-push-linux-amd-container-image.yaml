name: Publish amd64 Container Image to GHCR

# [ version 1.0.0 ] Dated 26-Jun-2026
# Creates a linux/amd64 docker image with a 20 minute time-out

on:
  workflow_call:
    inputs:
      repository:
        description: The repository name. Used for code checkout and as a prefix for the image name. For example, "project-tango".
        required: true
        type: string
      service:
        description: The name of the service (frontend, backend etc). Used to guide build context.
        required: true
        type: string
      version:
        description: The version of the image. Used to tag the image.
        required: true
        type: string
      use_root_context:
        description: 'Use root context for shared resources'
        required: false
        type: boolean
        default: false
      build_timeout_minutes:
        description: 'Maximum number of minutes the build-and-push job is allowed to run before being cancelled.'
        required: false
        type: string
        default: "20"

env:
  IMAGE_NAME: ${{ inputs.repository }}/${{ inputs.service }}
  PLATFORM: linux/amd64

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  build-and-push:
    name: Build amd64 Container Image and Push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.build_timeout_minutes != '' && inputs.build_timeout_minutes || '20') }}
    steps:
      - name: Checkout calling repo
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Case handling for image name
        # Required for repos with uppercase letters in their name
        id: image-name
        run: |
          lower_image_name=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          echo "lower_image_name=${lower_image_name}" >> $GITHUB_OUTPUT

      - name: Print image tags and platform
        run: |
          echo "Image will be tagged as:"
          echo "${{ steps.image-name.outputs.lower_image_name }}:${{ inputs.version }}"
          echo "${{ steps.image-name.outputs.lower_image_name }}:latest"
          echo "Platform: ${PLATFORM}"

      - name: Build and push docker image to ghcr.io
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.use_root_context == true && '.' || format('./{0}', inputs.service) }}
          file: ./${{ inputs.service }}/Dockerfile
          push: true
          platforms: ${{ env.PLATFORM }}
          tags: |
            ghcr.io/${{ steps.image-name.outputs.lower_image_name }}:${{ inputs.version }}
            ghcr.io/${{ steps.image-name.outputs.lower_image_name }}:latest

  report-outcome:
    name: Report Build Outcome on Failure
    runs-on: ubuntu-latest
    needs: build-and-push
    if: always() && (needs.build-and-push.result == 'failure' || needs.build-and-push.result == 'cancelled' || needs.build-and-push.result == 'timed_out')
    steps:
      - name: Write failure summary
        run: |
          echo "::warning::Build job ended with result: ${{ needs.build-and-push.result }}"
          {
            echo "> [!CAUTION]"
            echo "> The build job ended with result: \`${{ needs.build-and-push.result }}\`"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Result | \`${{ needs.build-and-push.result }}\` |"
            echo "| Image Version | \`${{ inputs.version }}\` |"
            echo "| Platform | \`${PLATFORM}\` |"
            echo "| Build Timeout limit | \`${{ inputs.build_timeout_minutes }} min\` |"
          } >> $GITHUB_STEP_SUMMARY